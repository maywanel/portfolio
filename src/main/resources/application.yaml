spring:
  application:
    name: portfolio-backend
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/resources/static
    livereload:
      enabled: true
  web:
    resources:
      cache:
        period: 0
      chain:
        cache: false
      static-locations: file:src/main/resources/static/,classpath:/static/

portfolio:
  github:
    username: maywanel
    fallback-file: classpath:projects-fallback.json
    cache-ttl-minutes: 30

logging:
  level:
    com.mohamedelmessaadi.portfolio: INFO
